[package]
name = "on-the-record"
version = "0.1.0"
description = "What an ordinary action, and an ordinary day, put on the record about you."
edition = "2021"
rust-version = "1.77"

[lib]
name = "on_the_record_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
